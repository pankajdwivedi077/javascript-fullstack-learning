apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: 
  name: mern-ingress
  namespace: devops-part3
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: merndemo.local
      http: 
        path:
         - path: api
           pathType: Prefix
           backend: 
             service:
               name: backend
               port:
                 number: 5000
         - path: /
           pathType: Prefix
           backend:
             service:
               name: frontend
               port: 5173
         
                               
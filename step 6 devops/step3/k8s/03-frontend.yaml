apiVersion: apps/v1
kind: Deployment
metadata: 
  name: frontend
  namespace: devops-part3
  labels:
    app: frontend
spec:
 spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      container:
       - name: frontend
         image: frontend:local
         imagePullPolicy: IfNotPresent
         ports:
          - containerPort: 5173
         
---            

apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: devops-part3
spec:
  selector:
    app: frontend
  ports:
     ports: 5173
     targetPort: 5173
  type: ClusterIP                               
services:
  mongo:
    image: mongo:7
    container_name: devops-advanced-course-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
    container_name: devops-advanced-course-server
    env_file:
      - ./server/.env
    depends_on:
      - mongo
    ports:
      - "5000:5000"

  web:
    build:
      context: ./web
    container_name: devops-advanced-course-web
    depends_on:
      - server
    ports:
      - "5173:5173"

volumes:
  mongo_data:





version: '3.8'

services:
  database:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: step2prisma
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
   build:
   container_name: express_api
   depends_on:
    - database
   environment:
    - DATABASE_URL=postgresql://postgres:root@database:5432/step2prisma?schema=public
   ports: 
    - "3000:3000"
   volumes:
    - /user/src/app
    - /user/src/app/node_modules
   command: ["sh", "-c", "npx prisma generate && node src/server.ts"]         
   
